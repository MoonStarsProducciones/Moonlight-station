- type: entity
  parent:
  - AppearanceTajaran
  - BaseSpeciesMobOrganic
  - MobNightVision
  id: MobTajaran
  name: Urist McTajaran
  components:
  #- type: DamageVisuals # Trauma - wound visuals used instead
  #  damageOverlayGroups:
  #    Brute:
  #      sprite: Mobs/Effects/brute_damage.rsi
  #      color: "#ccac1f"
  #    Burn:
  #      sprite: Mobs/Effects/burn_damage.rsi
  - type: MessyDrinker
    spillChance: 0.33
  - type: Speech
    speechSounds: Alto
    speechVerb: Felinid
    allowedEmotes: [ 'Hiss', 'Meow', 'Mew', 'Purr' ]
  - type: TypingIndicator
    proto: felinid
  - type: Vocal
    emoteSounds: MaleFelinid
  - type: Damageable
    damageModifierSet: Tajaran
  - type: TemperatureProtection # fur is a good insulator, actually
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Flammable
    firestackFade: -0.08 # until you light it up, cuz it's oily too. 20% lower than default
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: Temperature
    currentTemperature: 311.76  # Body temperature of cat
  - type: TemperatureDamage
    coldDamageThreshold: 248.15 # -25 degrees centigrade, like 12 degrees below normal "takes cold damage"
    coldDamage:
      types:
        Cold: 0.080 # in line with cold resist
    heatDamage:
      types:
        Heat: 1.80 # in line with heat dmg received up
  - type: ThermalRegulator
    normalBodyTemperature: 311.76
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood # Trauma - no piss fetish please
        Quantity: 300 # Trauma, was 600
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_human

